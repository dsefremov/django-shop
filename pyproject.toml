[project]
name = "django-shop"
version = "2.0.0"
description = "Учебный интернет-магазин на Django 5.2 LTS"
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["node_modules", "var", "staticfiles", "media", "*/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4", "RUF", "N", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["node_modules/", "var/", "staticfiles/"]

[[tool.mypy.overrides]]
module = ["django_filters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy типизирован частично: объявления фабрик — без проверки вызовов.
module = ["tests.factories"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
