{% load shop %}
{# Поле формы: подпись, виджет с классом .input, ошибки. #}
<div>
    <label for="{{ field.id_for_label }}" class="label">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-neutral-400">(необязательно)</span>{% endif %}</label>
    {{ field|input_widget }}
    {% if field.help_text %}<p class="mt-1 text-xs text-neutral-500">{{ field.help_text|safe }}</p>{% endif %}
    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
